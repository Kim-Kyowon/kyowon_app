<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>아파트 임장 체크리스트</title>
  
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: var(--bg); 
      color: var(--text); 
      padding-bottom: calc(74px + env(safe-area-inset-bottom, 0px)); 
    }
    
    header {
      position: sticky;
      top: 0;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      z-index: 10;
    }
    .header-content {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title { font-size: 1.05rem; font-weight: 700; color: var(--text); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .saved-count { font-size: 0.78rem; font-weight: 600; color: var(--primary); background: var(--primary-light); padding: 4px 8px; border-radius: 999px; }

    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .list-card { background: #f1f5f9; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .list-title { font-size: 0.88rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .btn-new { background: #334155; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    
    .select-box { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 0.95rem; background: #fff; font-weight: 600; margin-bottom: 8px; }
    .manage-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-del { background: transparent; border: 1px solid var(--border); color: var(--danger); font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; }

    .section-title { font-size: 0.9rem; font-weight: 700; margin: 16px 0 8px 4px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
    
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .field-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; background: #fff; }
    .field-input:focus { outline: none; border-color: var(--primary); }
    .field-row { display: flex; gap: 8px; }
    .field-row > div { flex: 1 1 0; min-width: 0; }

    .chip-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .chip { padding: 8px 14px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; cursor: pointer; color: var(--text); }
    .chip:active { background: #e2e8f0; }

    .estimate-display { margin-top: 4px; font-size: 0.72rem; font-weight: 600; color: var(--primary); line-height: 1.4; }
    .estimate-display:empty { display: none; }

    textarea.field-input { resize: vertical; min-height: 70px; line-height: 1.4; }

    /* 메인 액션 버튼 그룹 (카드 하단) */
    .action-button-group {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .btn-action {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-action-save { background: var(--primary); color: #fff; }
    .btn-action-save:active { background: #1d4ed8; }
    .btn-action-copy { background: #334155; color: #fff; }
    .btn-action-copy:active { background: #1e293b; }

    /* 하단 글로벌 탭 네비게이터 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .bottom-nav-inner {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      height: 56px;
    }
    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      transition: color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-tab:active { background: #f8fafc; }
    .nav-tab.active { color: var(--primary); }
    .nav-tab svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="nav-left">
        <div class="title">아파트 임장 체크</div>
      </div>
      <div class="header-right">
        <div class="saved-count" id="listBadge">0건 저장됨</div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="list-card">
      <div class="list-header">
        <span class="list-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          저장된 매물 목록
        </span>
        <button type="button" class="btn-new" onclick="createNewProperty()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          새 매물
        </button>
      </div>
      <select id="propertySelect" class="select-box" onchange="onSelectChange(this.value)">
        <option value="">-- 매물을 선택하세요 --</option>
      </select>
      <div class="manage-actions" id="deleteActionRow" style="display: none;">
        <button type="button" class="btn-del" onclick="deleteCurrentProperty()">매물 삭제</button>
      </div>
    </div>

    <div class="section-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      기본 정보
    </div>
    <div class="card">
      <div class="field">
        <label class="field-label">아파트 명 / 동호수</label>
        <input type="text" id="propName" class="field-input" placeholder="예: 래미안 102동 1403호" />
      </div>
      <div class="field field-row">
        <div>
          <label class="field-label">가격 (매매가 등)</label>
          <input type="text" id="propPrice" class="field-input" placeholder="예: 7.2억" oninput="updatePriceEstimate()" />
          <div id="priceEstimate" class="estimate-display" aria-live="polite"></div>
        </div>
        <div>
          <label class="field-label">전용면적 (m²)</label>
          <input type="text" id="propArea" class="field-input" placeholder="예: 84.99" oninput="updateAreaEstimate()" />
          <div id="areaEstimate" class="estimate-display" aria-live="polite"></div>
        </div>
      </div>
      <div class="field field-row">
        <div>
          <label class="field-label">세대수 (세대)</label>
          <input type="text" id="propHouseholds" class="field-input" placeholder="예: 3,885" />
        </div>
        <div>
          <label class="field-label">준공일자 (년)</label>
          <input type="text" id="propBuilt" class="field-input" placeholder="예: 2014" oninput="updateAge()" />
          <div id="ageDisplay" class="estimate-display" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <div class="section-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 11 12 14 22 4"></polyline>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
      </svg>
      현장 체크리스트
    </div>
    <div class="card">
      <div class="field">
        <label class="field-label">방 / 화장실 숫자</label>
        <input type="text" id="roomBath" class="field-input" placeholder="예: 방 3개 / 화장실 2개" />
        <div class="chip-group">
          <button type="button" class="chip" onclick="quickFill('roomBath', '방 3 / 화 2')">방3 화2</button>
          <button type="button" class="chip" onclick="quickFill('roomBath', '방 4 / 화 2')">방4 화2</button>
          <button type="button" class="chip" onclick="quickFill('roomBath', '방 3 / 화 1')">방3 화1</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">확장 여부</label>
        <input type="text" id="extension" class="field-input" placeholder="예: 거실+작은방 확장" />
        <div class="chip-group">
          <button type="button" class="chip" onclick="quickFill('extension', '올확장')">올확장</button>
          <button type="button" class="chip" onclick="quickFill('extension', '거실 확장')">거실확장</button>
          <button type="button" class="chip" onclick="quickFill('extension', '비확장')">비확장</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">안방 사이즈</label>
        <input type="text" id="masterBed" class="field-input" placeholder="예: 킹침대+화장대 여유" />
      </div>

      <div class="field">
        <label class="field-label">수납공간</label>
        <input type="text" id="storage" class="field-input" placeholder="예: 현관 팬트리 있음, 안방 드레스룸" />
      </div>

      <div class="field field-row">
        <div>
          <label class="field-label">관리비 (여름)</label>
          <input type="text" id="feeSummer" class="field-input" placeholder="예: 25만 원" />
        </div>
        <div>
          <label class="field-label">관리비 (겨울)</label>
          <input type="text" id="feeWinter" class="field-input" placeholder="예: 32만 원" />
        </div>
      </div>

      <div class="field">
        <label class="field-label">수리 필요항목</label>
        <textarea id="repairNeeds" class="field-input" placeholder="예: 싱크대 수전 교체, 안방 욕실 줄눈 보수"></textarea>
      </div>

      <div class="field">
        <label class="field-label">입주 가능일자</label>
        <input type="text" id="moveInDate" class="field-input" placeholder="예: 11월 중순 (협의)" />
      </div>

      <div class="field">
        <label class="field-label">주차공간</label>
        <input type="text" id="parking" class="field-input" placeholder="예: 지하 직결, 세대당 1.3대" />
      </div>

      <div class="field">
        <label class="field-label">교통편</label>
        <input type="text" id="transport" class="field-input" placeholder="예: 지하철역 도보 7분" />
      </div>

      <div class="field">
        <label class="field-label">기타 옵션</label>
        <textarea id="etcOptions" class="field-input" placeholder="예: 시스템에어컨 4대, 중문 포함"></textarea>
      </div>
    </div>

    <!-- 하단 액션 버튼 -->
    <div class="action-button-group">
      <button type="button" class="btn-action btn-action-save" onclick="saveItem()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        매물 저장
      </button>
      <button type="button" class="btn-action btn-action-copy" onclick="copySummary()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        기록 복사
      </button>
    </div>
  </div>

  <!-- 하단 글로벌 탭 네비게이터 -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="../index.html" class="nav-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>홈</span>
      </a>
      <a href="../asset/index.html" class="nav-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        <span>자산현황</span>
      </a>
      <a href="../card/index.html" class="nav-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
          <line x1="1" y1="10" x2="23" y2="10"></line>
        </svg>
        <span>카드실적</span>
      </a>
      <a href="../wellbeing/index.html" class="nav-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
        <span>웰빙클럽</span>
      </a>
      <a href="../apt/index.html" class="nav-tab active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>임장노트</span>
      </a>
    </div>
  </nav>

  <script>
    const STORAGE_KEY = "my_apt_list_db";
    const fieldIds = [
      "propName", "propPrice", "propHouseholds", "propArea", "propBuilt",
      "roomBath", "extension", "masterBed", "storage",
      "feeSummer", "feeWinter", "repairNeeds", "moveInDate",
      "parking", "transport", "etcOptions"
    ];

    let currentSelectedId = null;

    function getDB() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }

    function setDB(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      refreshUI();
    }

    function calcAge(built) {
      const m = /(19|20)\d{2}/.exec(built || "");
      if (!m) return null;
      const age = new Date().getFullYear() - parseInt(m[0], 10);
      return age >= 0 ? age : null;
    }

    function updateAge() {
      const age = calcAge(document.getElementById("propBuilt").value);
      document.getElementById("ageDisplay").innerText = age === null ? "" : `연식 ${age}년차`;
    }

    function parsePriceWon(text) {
      const normalized = (text || "").replace(/,/g, "").replace(/원/g, "").trim();
      if (!normalized) return null;
      const matches = [...normalized.matchAll(/(\\d+(?:\\.\\d+)?)\\s*(억|만)?/g)];
      if (!matches.length) return null;
      if (!matches.some(match => match[2])) {
        const value = Number(normalized);
        return Number.isFinite(value) && value > 0 ? value : null;
      }
      let total = 0;
      for (const match of matches) {
        const value = Number(match[1]);
        if (!Number.isFinite(value)) continue;
        total += value * (match[2] === "억" ? 100000000 : match[2] === "만" ? 10000 : 1);
      }
      return total > 0 ? total : null;
    }

    function formatMan(won) {
      return Math.round(won / 10000).toLocaleString("ko-KR");
    }

    function updatePriceEstimate() {
      const price = parsePriceWon(document.getElementById("propPrice").value);
      const output = document.getElementById("priceEstimate");
      if (!price) {
        output.innerText = "";
        return;
      }
      let acquisitionRate;
      if (price <= 600000000) acquisitionRate = 0.011;
      else if (price <= 900000000) {
        const ratePercent = (price / 100000000 * 2 / 3) - 3;
        acquisitionRate = ratePercent * 1.1 / 100;
      } else acquisitionRate = 0.033;
      const brokerageRate = price < 50000000 ? 0.006
        : price < 200000000 ? 0.005
        : price < 900000000 ? 0.004 : 0.009;
      output.innerText = `취득세 ${formatMan(price * acquisitionRate)}만 · 복비 ${formatMan(price * brokerageRate)}만`;
    }

    function updateAreaEstimate() {
      const areaText = (document.getElementById("propArea").value || "").replace(/,/g, "").trim();
      const area = Number(areaText.replace(/㎡|m²|m2/gi, "").trim());
      const output = document.getElementById("areaEstimate");
      output.innerText = Number.isFinite(area) && area > 0 ? `${(area * 0.3025).toFixed(1)}평` : "";
    }

    function quickFill(id, text) {
      document.getElementById(id).value = text;
    }

    function refreshUI() {
      const db = getDB();
      const select = document.getElementById("propertySelect");
      const badge = document.getElementById("listBadge");
      const delRow = document.getElementById("deleteActionRow");

      badge.innerText = `${db.length}건 저장됨`;
      select.innerHTML = '<option value="">-- 매물을 선택하세요 --</option>';
      db.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = item.propName ? `${item.propName}${item.propPrice ? ' · ' + item.propPrice : ''} (${item.propArea || '면적미입력'})` : `무제 (${item.date})`;
        if (item.id === currentSelectedId) opt.selected = true;
        select.appendChild(opt);
      });

      delRow.style.display = currentSelectedId ? "block" : "none";
    }

    function onSelectChange(id) {
      if (!id) {
        createNewProperty();
        return;
      }
      loadItem(id);
    }

    function loadItem(id) {
      const db = getDB();
      const target = db.find(x => x.id === id);
      if (!target) return;

      currentSelectedId = target.id;
      fieldIds.forEach(fid => {
        document.getElementById(fid).value = target[fid] || "";
      });
      updateAge();
      updatePriceEstimate();
      updateAreaEstimate();
      refreshUI();
    }

    function saveItem() {
      const name = document.getElementById("propName").value.trim();
      if (!name) {
        alert("최소한 [아파트 명 / 동호수]는 입력해야 합니다.");
        document.getElementById("propName").focus();
        return;
      }

      const db = getDB();
      const itemData = {
        id: currentSelectedId || ("prop_" + Date.now()),
        date: new Date().toLocaleDateString('ko-KR')
      };

      fieldIds.forEach(fid => {
        itemData[fid] = document.getElementById(fid).value;
      });

      const existingIndex = db.findIndex(x => (x.propName || "").trim() === name);
      const idIndex = db.findIndex(x => x.id === itemData.id);
      const saveIndex = existingIndex >= 0 ? existingIndex : idIndex;
      if (saveIndex >= 0) {
        itemData.id = db[saveIndex].id;
        db[saveIndex] = itemData;
      } else {
        db.unshift(itemData);
      }
      currentSelectedId = itemData.id;

      setDB(db);
      const price = (itemData.propPrice || "").trim();
      alert(`[${name}${price ? ` · ${price}` : ""}] 매물이 정상 저장되었습니다.`);
    }

    function createNewProperty() {
      currentSelectedId = null;
      fieldIds.forEach(fid => {
        document.getElementById(fid).value = "";
      });
      updateAge();
      updatePriceEstimate();
      updateAreaEstimate();
      refreshUI();
    }

    function deleteCurrentProperty() {
      if (!currentSelectedId) return;
      if (!confirm("현재 매물 기록을 삭제하시겠습니까?")) return;

      let db = getDB();
      db = db.filter(x => x.id !== currentSelectedId);
      currentSelectedId = null;
      setDB(db);
      createNewProperty();
      alert("삭제되었습니다.");
    }

    function copySummary() {
      const g = (id) => document.getElementById(id).value.trim() || "-";
      const age = calcAge(document.getElementById("propBuilt").value);
      const ageText = age === null ? "" : ` (연식 ${age}년차)`;
      const summary = 
`[아파트 임장 기록]
■ 기본 정보
- 아파트/동호수: ${g('propName')}
- 세대수: ${g('propHouseholds')}
- 가격: ${g('propPrice')}
- 전용면적: ${g('propArea')}
- 준공일자: ${g('propBuilt')}${ageText}

■ 체크리스트
1. 방/화장실: ${g('roomBath')}
2. 확장여부: ${g('extension')}
3. 안방 사이즈: ${g('masterBed')}
4. 수납공간: ${g('storage')}
5. 관리비: 여름(${g('feeSummer')}) / 겨울(${g('feeWinter')})
6. 수리 필요항목: ${g('repairNeeds')}
7. 입주 가능일자: ${g('moveInDate')}
8. 주차공간: ${g('parking')}
9. 교통편: ${g('transport')}
10. 기타 옵션: ${g('etcOptions')}`;

      navigator.clipboard.writeText(summary).then(() => {
        alert("클립보드에 복사되었습니다. 카카오톡 등에 붙여넣기 하세요.");
      });
    }

    refreshUI();
    updatePriceEstimate();
    updateAreaEstimate();
  </script>
</body>
</html>
